buildscript {
    repositories {
        maven {
            url = 'https://maven.fabricmc.net'
            metadataSources {
                mavenPom()
                artifact()
                ignoreGradleMetadataRedirection()
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('net.fabricmc:fabric-loom:1.15.5')
    }
}

apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: 'net.fabricmc.fabric-loom'

base {
    archivesName = "${mod_id}-fabric-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_26 as int
}

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java25Launcher
}

sourceSets.main.java {
    srcDir 'src/main/java'
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir file('../common/src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version_26}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version_26}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version_26}"

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
}

loom {
    def aw = file("src/main/resources/better_lib.accesswidener")
    if (!aw.exists()) {
        aw = file("../common/src/main/resources/${mod_id}.accesswidener")
    }
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

afterEvaluate {
    tasks.named('jar').configure { task ->
        task.actions.removeAll { act ->
            def inner = act.hasProperty('action') ? act.action : null
            return inner?.class?.name?.contains('ManifestModificationAction')
        }
    }
}

processResources {
    var replaceProperties = [\
            minecraft_version    : minecraft_version_26,\
            fabric_loader_version: fabric_loader_version_26,\
            java_version         : java_version_26,\
            mod_id               : mod_id,\
            mod_name             : mod_name,\
            mod_version          : mod_version,\
            version              : mod_version,\
            mod_authors          : mod_authors,\
            mod_author           : mod_authors,\
            mod_description      : mod_description,\
            description          : mod_description,\
            mod_license          : mod_license,\
            license              : mod_license\
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {\
        expand replaceProperties
    }
}
