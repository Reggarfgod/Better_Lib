plugins {
    id 'dev.architectury.loom' version '1.13.468'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}

def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java21Launcher
}

sourceSets.main.java {
    srcDir 'src/main/java'
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir file('../common/src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1_21}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version_1_21}"
    modImplementation "curse.maven:text-placeholder-api-1037459:6131327"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
    annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")
}

loom {
    def aw = file("../common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version_1_21,
            java_version         : java_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            version              : mod_version,
            mod_authors          : mod_authors,
            mod_author           : mod_authors,
            mod_description      : mod_description,
            description          : mod_description,
            mod_license          : mod_license,
            license              : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
