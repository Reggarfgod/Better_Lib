pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Better_Lib'

// 1.20.1
include '1.20.1:forge'
include '1.20.1:fabric'

// 1.21.1
include '1.21.1:neoforge'
include '1.21.1:fabric'
include '1.21.1:forge'

// 1.21.11
include '1.21.11:neoforge'
include '1.21.11:fabric'
include '1.21.11:forge'

// 26.1 and above
include '26.1:neoforge'
include '26.1:fabric'
// 26.1:forge requires Gradle 9.3+ standalone
// include '26.1:forge'

// 26.3 and above
include '26.3:neoforge'
include '26.3:fabric'
// 26.3:forge requires Gradle 9.3+ standalone
// include '26.3:forge'
